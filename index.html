<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo Marvel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="main-header">
    <div class="header-container">
      <h1 class="logo"><span>M</span>ARVEL CATALOG</h1>
      <p class="subtitle">O universo cinematográfico da Marvel em um só lugar</p>
    </div>
  </header>

  <main class="catalog-container">
    <section class="controls-section">
      <h2 class="section-title">Catálogo Interativo de Filmes da Marvel</h2>
      
      <div class="search-filter-wrapper">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Buscar por nome ou categoria...">
        </div>
        
        <div class="filter-buttons">
          <button class="cat-btn active" data-category="todos">Todos</button>
          <button class="cat-btn" data-category="fase-1">Fase 1</button>
          <button class="cat-btn" data-category="fase-2">Fase 2</button>
          <button class="cat-btn" data-category="fase-3">Fase 3</button>
          <button class="cat-btn" data-category="fase-4">Fase 4</button>
          <button class="cat-btn" data-category="fase-5">Fase 5</button>
        </div>
      </div>

      <div class="meta-info">
        <span id="resultsCount">0 filme(s) encontrado(s)</span>
      </div>
    </section>

    <section id="gallery" class="gallery-grid"></section>

    <div id="emptyState" class="empty-state" hidden>
      <p>Nenhum filme encontrado para a sua busca.</p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
